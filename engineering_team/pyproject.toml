[project]
name = "engineering_team"
version = "0.1.0"
description = "engineering_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,google-genai,tools]==1.9.3",
    # macOS 12 (x86_64) needs an ORT build that still ships compatible wheels.
    "gradio>=6.13.0",
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
[project.scripts]
engineering_team = "engineering_team.main:run"
run_crew = "engineering_team.main:run"
train = "engineering_team.main:train"
replay = "engineering_team.main:replay"
test = "engineering_team.main:test"
run_with_trigger = "engineering_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
# Force uv to resolve packages for macOS Intel (this machine),
# avoiding versions that only publish non-compatible wheels.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
