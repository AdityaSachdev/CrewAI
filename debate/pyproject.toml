[project]
name = "debate"
version = "0.1.0"
description = "debate using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    # macOS 12 (x86_64) needs an ORT build that still ships compatible wheels.
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
debate = "debate.main:run"
run_crew = "debate.main:run"
train = "debate.main:train"
replay = "debate.main:replay"
test = "debate.main:test"
run_with_trigger = "debate.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
# Force uv to resolve packages for macOS Intel (this machine),
# avoiding versions that only publish non-compatible wheels.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
